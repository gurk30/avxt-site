<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AVXT · AI receptionist for Ontario home service shops</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0c0d12">
<style>
@font-face{font-family:'Space Grotesk';src:url('/fonts/space-grotesk-regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Space Grotesk';src:url('/fonts/space-grotesk-bold.woff2') format('woff2');font-weight:700;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Space Grotesk','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(160deg,#e9ecfb 0%,#dcd8f5 55%,#e7dcf1 100%);
  min-height:100vh;display:grid;place-items:center;padding:clamp(10px,2.5vw,34px);
}
.card{
  background:#0c0d12;border-radius:clamp(18px,3vw,30px);
  padding:clamp(48px,8vw,110px) clamp(26px,6vw,88px);
  max-width:720px;width:100%;box-shadow:0 30px 80px rgba(30,25,80,.28);
}
h1{color:#f4f5f9;font-weight:700;font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:-.02em;line-height:1.05}
p{color:#c3c7d9;margin-top:1.1rem;font-size:1.05rem;line-height:1.6}
a{display:inline-block;margin-top:2rem;background:#4353ff;color:#fff;text-decoration:none;
  border-radius:999px;padding:.95rem 1.7rem;font-weight:500;line-height:1}
a:hover{background:#3945e8}
a:focus-visible{outline:2px solid #f472b6;outline-offset:2px}
</style>
</head>
<body>
<div class="card">
  <h1>Nothing at this address.</h1>
  <p>The page you want is the front one.</p>
  <a href="https://avxt.ca/">Back to avxt.ca</a>
</div>
</body>
</html>
