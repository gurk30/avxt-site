server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 1024;

    # fonts and images are content-hashed by name stability; cache hard
    location ~* \.(woff2|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # html revalidates on every visit so copy changes land instantly
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
    }
}
